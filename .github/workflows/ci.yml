name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cli sdk/go)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/ubtd ./cli/ubtd
      - run: go build -o bin/ubt ./cli/ubtctl
      - run: go build -o bin/ubtctl ./cli/ubtctl
      - name: Installer syntax
        run: sh -n scripts/install.sh && bash -n scripts/install.sh
      - name: ShellCheck installer
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest scripts/test_install.py -v
      - run: python3 scripts/smoke.py
      - run: python3 -m unittest discover -s examples/chat -p 'test_*.py' -v
  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    env:
      GORELEASER_VERSION: v2.18.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Verify release bundle matrix
        shell: bash
        run: |
          expected_members=$'LICENSE.txt\nREADME.md\nubt\nubtctl\nubtd'
          for os in darwin linux; do
            for arch in amd64 arm64; do
              archive="dist/universal-bluetooth-sdk_${os}_${arch}.tar.gz"
              test -f "$archive"
              actual_members="$(tar -tzf "$archive" | LC_ALL=C sort)"
              if [[ "$actual_members" != "$expected_members" ]]; then
                echo "Unexpected members in $archive:" >&2
                printf '%s\n' "$actual_members" >&2
                exit 1
              fi
            done
          done
          (cd dist && sha256sum --check checksums.txt)
